project_directory: project
virtual_projects: []
ignore_paths: []
console_port: 4245
project_key: blbs
project_management_template: null

# Hierarchy and types are fixed today; kept here for validation.
hierarchy:
  - initiative
  - epic
  - task
  - sub-task
types:
  - bug
  - story
  - chore

workflows:
  default:
    backlog: [open, closed]
    open: [in_progress, closed, backlog]
    in_progress: [open, blocked, closed]
    blocked: [in_progress, closed]
    closed: [open]
  epic:
    open: [in_progress, closed]
    in_progress: [open, closed]
    closed: [open]

type_colors:
  bug: red
  chore: green
  epic: magenta
  event: bright_blue
  initiative: bright_blue
  story: yellow
  sub-task: bright_cyan
  task: cyan
beads_compatibility: false
