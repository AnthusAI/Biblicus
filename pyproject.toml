[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "biblicus"
version = "1.10.0"
description = "Command line interface and Python library for corpus ingestion, retrieval, and evaluation."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "pypdf>=4.0",
  "Jinja2>=3.1",
  "dotyaml>=0.1.3",
  "numpy>=1.24",
]

[project.optional-dependencies]
dspy = [
  "dspy>=2.5",
  "litellm>=1.0",
]
openai = [
  "openai>=1.0",
]
unstructured = [
  "unstructured>=0.12.0",
  "python-docx>=1.1.0",
]
ocr = [
  "rapidocr-onnxruntime>=1.3.0; python_version<'3.13'",
]
paddleocr = [
  "paddleocr>=2.7.0",
  "paddlepaddle>=2.5.0",
  "huggingface_hub>=0.20.0",
  "requests>=2.28.0",
]
markitdown = [
  "markitdown[all]>=0.1.0; python_version>='3.10' and python_version<'3.14'",
]
deepgram = [
  "deepgram-sdk>=3.0",
]
aldea = [
  "httpx>=0.24",
]
docling = [
  "docling[vlm]>=2.84.0",
]
docling-mlx = [
  "docling[mlx-vlm]>=2.84.0",
]
tesseract = [
  "pytesseract>=0.3.10",
  "pillow>=10.0.0",
]
topic-modeling = [
  "bertopic>=0.17.4",
]
ner = [
  "spacy>=3.7.0",
]
markov-analysis = [
  "hmmlearn>=0.3.0",
]
neo4j = [
  "neo4j>=5.0.0",
]
datasets = [
  "datasets>=2.18.0",
]
aws = [
  "boto3>=1.34",
]
azure = [
  "azure-storage-blob>=12.20",
]
reinforcement-memory = [
  "virtuus>=0.5.0",
  "bertopic>=0.17.4",
]

[tool.poetry.group.dev.dependencies]
behave = ">=1.2.6"
coverage = { version = ">=7.0", extras = ["toml"] }
boto3 = ">=1.34"
pytest = ">=8.0"
virtuus = ">=0.5.0"
bertopic = ">=0.17.4"
sphinx = ">=7.0"
myst-parser = ">=2.0"
sphinx_rtd_theme = ">=2.0"
ruff = ">=0.4.0"
black = ">=24.0"
python-semantic-release = ">=9.0.0"

[project.scripts]
biblicus = "biblicus.cli:main"

[tool.poetry]
packages = [{ include = "biblicus", from = "src" }]

[tool.coverage.run]
branch = true
source = ["biblicus"]
omit = [
  "*/biblicus/_vendor/*",
  "*/biblicus/analysis/*",
  "*/biblicus/analysis/reinforcement_memory/*",
  "*/biblicus/evaluation/*",
  "*/biblicus/ai/*",
  "*/biblicus/corpus.py",
  "*/biblicus/extraction.py",
  "*/biblicus/extractors/aldea_stt.py",
  "*/biblicus/extractors/deepgram_*",
  "*/biblicus/cli.py",
  "*/biblicus/graph/neo4j.py",
  "*/biblicus/graph/extraction.py",
  "*/biblicus/graph/extractors/dependency_relations.py",
  "*/biblicus/graph/extractors/ner_entities.py",
  "*/biblicus/graph/extractors/simple_entities.py",
  "*/biblicus/workflow.py",
  "*/biblicus/knowledge_base.py",
  "*/biblicus/migration.py",
  "*/biblicus/sync/amplify_publisher.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 98
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "D",      # pydocstyle (docstring rules)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package (__init__)
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__ method
    "D200",   # One-line docstring should fit on one line (project uses multi-line)
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D212",   # Multi-line summary at first line (conflicts with D213)
]

[tool.ruff.lint.per-file-ignores]
"src/biblicus/_vendor/*" = ["D"]  # Exclude vendored code
"features/steps/*.py" = ["D103"]  # Behave step functions are registered via decorators

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/biblicus/__init__.py:__version__"]
build_command = "python -m build"
upload_to_vcs_release = true
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
