name: Tactus compatibility

on:
  workflow_call:
    inputs:
      biblicus_ref:
        description: Commit of this repository to build the candidate wheel from.
        required: true
        type: string
      tactus_ref:
        description: Branch, tag, or commit of AnthusAI/Tactus to test against.
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  tactus_compatibility:
    name: Tactus tests against the candidate wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the Biblicus commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.biblicus_ref }}
          path: biblicus

      - name: Check out Tactus
        uses: actions/checkout@v4
        with:
          repository: AnthusAI/Tactus
          ref: ${{ inputs.tactus_ref }}
          path: tactus

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the Biblicus candidate wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir candidate biblicus

      - name: Install Tactus with its development extras
        working-directory: tactus
        run: |
          python -m pip install ".[dev]"

      - name: Replace the published Biblicus with the candidate wheel
        run: |
          python -m pip install --force-reinstall --no-deps candidate/*.whl
          python -c "import biblicus, importlib.metadata as metadata; print('Testing Tactus against Biblicus', metadata.version('biblicus'), 'from', biblicus.__file__)"

      - name: Run the Tactus pytest tests that exercise Biblicus
        working-directory: tactus
        run: |
          python -m pytest -n0 -m "not integration" \
            tests/core/test_retrieval.py \
            tests/core/test_context_assembler.py \
            tests/core/test_compaction.py \
            tests/core/test_runtime_tasks.py \
            tests/stdlib/test_biblicus_text.py \
            tests/dspy/test_agent_context_assembly.py

      - name: Run the Tactus behave scenarios that exercise Biblicus
        working-directory: tactus
        run: |
          python -m behave --tags=-skip \
            features/*_context_*.feature \
            features/90_task_dependency_planning.feature
