name: Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PAPYRUS_REQUIREMENT: "papyrus-newsroom[markus] @ git+https://github.com/AnthusAI/Papyrus.git@develop"

jobs:
  build:
    if: ${{ vars.DOCS_SITE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install package and development dependencies
        run: |
          poetry env use python3.12
          poetry install --with dev

      - name: Install the Papyrus documentation builder
        run: python -m pip install "$PAPYRUS_REQUIREMENT" "anthus-markus>=0.7.0,<1.0.0"

      - name: Build site
        run: >-
          python -m papyrus_content.markus_renderer.docs_site
          --docs docs --out _site --name "Biblicus"
          --tagline "Make your documents usable by your assistant, then decide later how you will search and retrieve them."
          --source-url "https://github.com/AnthusAI/Biblicus"
          --redirect-former-urls
          --contact-url "https://anth.us/engage/?solution=Biblicus&cta=docs"
          --exclude "pr-faq/**" --exclude "reports/**" --exclude "*-plan.md"

      - name: Build API reference with Sphinx
        run: poetry run sphinx-build -b html docs _site/api-reference

      - name: Redirect former Sphinx page URLs
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import re

          site = Path("_site")
          docs = Path("docs")
          for page in sorted(docs.rglob("*.md")):
              relative = page.relative_to(docs).as_posix()
              if relative == "index.md":
                  continue
              slug = re.sub(r"[^a-z0-9]+", "-", relative.removesuffix(".md").replace("/", "-").lower()).strip("-")
              former = site / (relative.removesuffix(".md") + ".html")
              if former.exists():
                  continue
              former.parent.mkdir(parents=True, exist_ok=True)
              target = "../" * relative.count("/") + f"articles/{slug}.html"
              former.write_text(
                  '<!DOCTYPE html><meta charset="utf-8">'
                  f'<meta http-equiv="refresh" content="0; url={target}">'
                  f'<link rel="canonical" href="{target}">'
                  f'<a href="{target}">Moved to {target}</a>',
                  encoding="utf-8",
              )
          PYTHON

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: ${{ vars.DOCS_SITE_ENABLED == 'true' && vars.DOCS_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
