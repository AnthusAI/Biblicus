name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install package and development dependencies
        run: |
          poetry env use python3.12
          poetry install --with dev

      - name: Run Ruff linter (including docstring checks)
        run: |
          poetry run ruff check src/biblicus/

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install package and development dependencies
        run: |
          poetry env use python${{ matrix.python-version }}
          poetry install --with dev --extras datasets

      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: |
            tests/fixtures/cache
            tests/fixtures/wikitext2_raw
          key: wikitext2-raw-${{ runner.os }}-${{ matrix.python-version }}-v1

      - name: Fetch WikiText-2 raw fixture (for CI tests)
        run: |
          poetry run python tests/fixtures/fetch_wikitext2.py

      - name: Run tests with coverage
        run: |
          poetry run python scripts/test.py

      - name: Export coverage JSON
        if: matrix.python-version == '3.12'
        run: |
          poetry run coverage json -o coverage.json

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json-py312
          path: coverage.json

  docs:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install package and development dependencies
        run: |
          poetry env use python3.12
          poetry install --with dev

      - name: Build Sphinx documentation
        run: |
          poetry run sphinx -b html docs docs/_build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy-docs:
    runs-on: ubuntu-latest
    needs: docs
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
